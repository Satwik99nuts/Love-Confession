<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together Forever? 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen flex items-center justify-center relative font-['Playfair_Display'] bg-pink-50">

    <!-- Tap to Start Overlay -->
    <div id="start-overlay" class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-black/90 text-white cursor-pointer transition-opacity duration-1000">
        <i class="ph-fill ph-heart text-6xl text-pink-500 animate-pulse mb-4"></i>
        <p class="font-['Playfair_Display'] text-2xl">Tap to begin</p>
    </div>

    <!-- Preloader for GIFs (HIDDEN - only for preloading) -->
    <div style="position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0;">
        <img src="https://media.tenor.com/71e-Dvs2fH0AAAAi/milk-and-mocha-cute.gif">
        <img src="https://media.tenor.com/Z6gmDPeM6dgAAAAi/dance-moves.gif">
        <img src="https://agi-prod-file-upload-public-main-use1.s3.amazonaws.com/e55782a9-a2f2-4598-aa9b-f483620c3735">
    </div>

    <canvas id="bg-canvas" class="absolute inset-0 z-0"></canvas>

    <!-- Guide Avatar Element -->
    <div id="guide-avatar-container" class="fixed z-[100] transition-all duration-1000 ease-in-out transform -translate-x-[500px]" style="top: 50%; left: 10%;">
        <div id="guide-speech-bubble" class="speech-bubble bubble-left hidden" style="top: -70px; left: 80px; width: max-content; max-width: 200px; white-space: normal; text-align: center;"></div>
        <img id="guide-img" src="new_avatar_happy.png" alt="Guide Avatar" class="w-32 h-32 object-contain drop-shadow-[0_5px_10px_rgba(0,0,0,0.5)]">
    </div>

    <!-- Floating Decor Stickers -->
    <div class="sticker-decor top-10 left-10 text-6xl opacity-80" style="--r: -15deg">🍓</div>
    <div class="sticker-decor bottom-20 right-20 text-7xl opacity-80" style="--r: 10deg; animation-delay: 1s;">🎀</div>
    <div class="sticker-decor top-1/2 left-5 text-4xl opacity-90" style="--r: 20deg; animation-delay: 2s;">🥛</div>
    <div class="sticker-decor top-20 right-1/3 text-5xl opacity-80" style="--r: -5deg; animation-delay: 1.5s;">💌</div>

    <!-- 90s Music Player Widget -->
    <div id="widget-music" class="retro-window w-64 top-8 right-8 z-[100] cursor-grab opacity-0 pointer-events-none transition-opacity duration-1000">
        <div class="title-bar">
            <span>Music_Player.exe</span>
            <div class="flex gap-2">
                <i class="ph-bold ph-minus hover:text-gray-200 cursor-pointer"></i>
                <i class="ph-bold ph-x hover:text-red-200 cursor-pointer"></i>
            </div>
        </div>
        <div class="p-4 bg-[#2b1055] text-white">
            <div class="flex items-center gap-4 mb-4">
                <div id="record-spin" class="w-12 h-12 bg-pink-500 rounded-full flex items-center justify-center animate-spin" style="animation-duration: 3s;">
                    <i class="ph-fill ph-music-notes text-2xl text-white"></i>
                </div>
                <div class="overflow-hidden whitespace-nowrap w-full">
                    <p class="font-bold text-sm text-pink-300 animate-[pulse_2s_infinite]">Now Playing:</p>
                    <p id="track-name-display" class="text-xs marquee-text">Romantic_Piano.mp3</p>
                </div>
            </div>
            <div class="flex justify-between items-center bg-black/30 p-2 rounded-lg">
                <button id="btn-prev" class="hover:text-pink-400 transition-colors"><i class="ph-fill ph-skip-back text-xl"></i></button>
                <button id="btn-playpause" class="hover:scale-110 transition-transform"><i id="play-icon" class="ph-fill ph-pause-circle text-4xl text-pink-500 hover:text-pink-400"></i></button>
                <button id="btn-next" class="hover:text-pink-400 transition-colors"><i class="ph-fill ph-skip-forward text-xl"></i></button>
            </div>
        </div>
    </div>

    <!-- MAIN MOVIE WINDOW -->
    <div id="main-window" class="retro-window w-[90%] max-w-[500px] z-50 transition-opacity duration-1000" style="top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; pointer-events: none;">

        <div class="title-bar">
            <span class="flex items-center gap-2"><i class="ph-fill ph-heart-straight text-red-500"></i> love_confession.mov</span>
            <div class="flex gap-2 text-xs">
                <i id="btn-minimize" class="ph-bold ph-minus hover:text-gray-200 cursor-pointer"></i>
                <i id="btn-maximize" class="ph-bold ph-square hover:text-gray-200 cursor-pointer"></i>
                <i id="btn-close" class="ph-bold ph-x hover:text-red-200 cursor-pointer"></i>
            </div>
        </div>

        <div class="char-stage">
            <div class="cloud-layer back"></div>
            <div class="cloud-layer"></div>
            <div class="stage-floor"></div>

            <div id="char-boy" class="char-container center-8">
                <div class="speech-bubble bubble-left hidden" id="bubble-boy"></div>
                <img id="boy-img" src="new_avatar_heart.png" alt="Boy Avatar" class="w-16 h-16 object-contain">
            </div>

            <div id="char-girl" class="char-container right-8">
                <div class="speech-bubble bubble-right hidden" id="bubble-girl"></div>
                <img id="girl-img" src="female_avatar.png" alt="Girl Avatar" class="w-16 h-16 object-contain">
            </div>

            <div class="absolute top-4 right-10 text-xl animate-pulse">✨</div>
            <div class="absolute top-10 left-10 text-xl animate-pulse delay-75">✨</div>
        </div>

        <div class="dialogue-box">
            <div class="absolute -top-3 left-4 bg-pink-500 text-white text-xs font-bold px-3 py-1 rounded-full border border-pink-700 shadow-md">
                @it_s_me_satwik
            </div>

            <h1 class="text-3xl md:text-4xl font-bold mt-2 text-pink-700 font-['Playfair_Display']">
                 Will you be my Player 2? 💖
            </h1>
            
            <p id="flirty-text" class="text-pink-500 text-xl font-['Caveat'] my-3 border-r-2 border-pink-400 pr-1 inline-block">
                >  I am waiting for you...
            </p>

            <div class="flex items-center gap-4 mt-4 relative">
                <button id="btn-yes" class="btn-pixel btn-yes flex-1 py-3 flex justify-center items-center gap-2 hover:brightness-110 active:scale-95">
                    <i class="ph-fill ph-heart text-red-600 animate-pulse"></i> YES
                </button>
                
                <div class="relative">
                    <div id="tease-bubble" class="absolute -top-14 left-1/2 -translate-x-1/2 bg-white border-2 border-black p-2 rounded text-[10px] font-bold hidden whitespace-nowrap shadow-lg z-50 text-center">
                        <span id="bubble-text">Try Again!</span>
                        <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 border-l-4 border-l-transparent border-r-4 border-r-transparent border-t-4 border-t-black"></div>
                    </div>
                    
                    <button id="btn-no" class="btn-pixel btn-no px-6 py-2 hover:bg-red-300 min-w-[80px]">NO</button>
                </div>
            </div>
        </div>
    </div>

    <!-- VIRTUAL HUG OVERLAY -->
    <div id="hug-overlay">
        <img src="new_avatar_heart.png" 
             alt="Happy Avatar" 
             class="w-48 h-48 object-contain mb-6 drop-shadow-[0_0_20px_rgba(255,105,180,0.8)] rounded-lg animate-bounce">
        <img src="female_avatar.png" 
             alt="Happy Female Avatar" 
             class="w-48 h-48 object-contain mb-6 drop-shadow-[0_0_20px_rgba(255,105,180,0.8)] rounded-lg animate-bounce">
        
        <h1 class="text-white font-['Playfair_Display'] text-center text-4xl leading-relaxed drop-shadow-lg">
            <span class="text-pink-300 text-6xl block mb-4 animate-bounce font-['Caveat']">YAY!</span>
            I LOVE YOU! 💖
        </h1>
        
        <button onclick="location.reload()" class="mt-8 bg-white text-pink-600 font-bold px-8 py-3 hover:bg-pink-100 rounded-full shadow-lg transition-transform hover:scale-105">
            Play Again?
        </button>
    </div>

    <!-- External JS -->
    <script src="script.js"></script>
</body>
</html>
